services:
  - type: web
    name: reybraztech-scraper
    env: node
    region: oregon
    plan: free
    rootDir: scraper
    buildCommand: npm install && npx puppeteer browsers install chrome && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
